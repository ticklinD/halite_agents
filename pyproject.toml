[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "halite"
version = "0.1.0"
description = "Halite — hybrid, terminal-based, TUI coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "tomli-w>=1.0",
    "ollama>=0.1.0",
    "keyring>=25.0",
    "cryptography>=41.0",
    "anthropic>=0.30",
    "playwright>=1.40",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
halite = "halite.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["halite*"]
